<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markorð: 81 - 90 algengustu orðin.</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }

        .lang-selector {
            margin-bottom: 20px;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ffcc80;
        }

        .lang-selector select {
            padding: 8px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
            max-width: 300px;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.1em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.6; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 70%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Markorð: 81 - 90 algengustu orðin.</h1>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="lang-selector">
        <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
        <select id="languageSelect" onchange="updateUI()">
            <option value="ar">Arabíska – العربية</option>
            <option value="da">Danska – Dansk</option>
            <option value="en" selected>Enska – English</option>
            <option value="tl">Filippseyska – Tagalog / Filipino</option>
            <option value="fr">Franska – Français</option>
            <option value="lv">Lettneska – Latviešu</option>
            <option value="lt">Litháíska – Lietuvių</option>
            <option value="no">Norska – Norsk</option>
            <option value="fa">Persneska – فارسی</option>
            <option value="pt">Portúgalska – Português</option>
            <option value="pl">Pólska – Polski</option>
            <option value="ro">Rúmenska – Română</option>
            <option value="ru">Rússneska – Русский</option>
            <option value="es">Spænska – Español</option>
            <option value="sv">Sænska – Svenska</option>
            <option value="th">Tælenska – ภาษาไทย</option>
            <option value="uk">Úkraínska – Українська</option>
            <option value="vi">Víetnamska – Tiếng Việt</option>
        </select>
    </div>

    <div id="counter"></div>
    
    <div id="target"></div>
    <div id="is-explanation"></div>
    <br>
    <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
    
    <div id="spoken"></div>
    <div id="result"></div>

    <div id="media-box"></div>

    <div class="nav-btns">
        <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
    </div>

    <div class="feedback-note">
        Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
    </div>
</div>

<script>
const exerciseData = [
    { 
        text: "hjá", 
        is_exp: "<b>Útskýring:</b> Forsetning sem þýðir að vera á sama stað, nærri, eða í heimsókn hjá einhverjum.<br><b>Samheiti:</b> hjá, nærri.<br><b>Dæmi:</b> Hann er <b>hjá</b> vini sínum.",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b> الشرح: حرف جر يعني التواجد في نفس المكان، بالقرب، أو عند زيارة شخص ما.<br><b>مرادف:</b> بالقرب، عند.<br><b>مثال:</b> هو <b>عند</b> صديقه.</div>",
            "da": "<b>Danska (Dansk):</b> Forklaring: Forholdsord, der betyder at være på samme sted, nær eller på besøg hos nogen.<br><b>Synonym:</b> hos, nær.<br><b>Eksempel:</b> Han er <b>hos</b> sin ven.",
            "en": "<b>Enska (English):</b> Explanation: Preposition meaning to be at the same place, near, or visiting someone.<br><b>Synonym:</b> near, by, with.<br><b>Example:</b> He is <b>with / at</b> his friend's.",
            "tl": "<b>Filippseyska (Tagalog):</b> Paliwanag: Pang-ukol na nangangahulugang nasa iisang lugar, malapit, o bumibisita sa isang tao.<br><b>Kasingkahulugan:</b> malapit, kasama.<br><b>Halimbawa:</b> Kasama niya ang kanyang kaibigan.",
            "fr": "<b>Franska (Français):</b> Explication: Préposition signifiant être au même endroit, près ou rendre visite à quelqu'un.<br><b>Synonyme:</b> près de, chez.<br><b>Exemple:</b> Il est <b>chez</b> son ami.",
            "lv": "<b>Lettneska (Latviešu):</b> Paskaidrojums: Prievārds, kas nozīmē būt tajā pašā vietā, tuvumā vai ciemoties.<br><b>Sinonīms:</b> pie, blakus.<br><b>Piemērs:</b> Viņš ir <b>pie</b> sava drauga.",
            "lt": "<b>Litháíska (Lietuvių):</b> Paaiškinimas: Prielinksnis, reiškiantis būti toje pačioje vietoje, šalia ar lankytis pas kažką.<br><b>Sinonimas:</b> pas, prie.<br><b>Pavyzdys:</b> Jis yra <b>pas</b> savo draugą.",
            "no": "<b>Norska (Norsk):</b> Forklaring: Preposisjon som betyr å være på samme sted, nær, eller på besøk hos noen.<br><b>Synonym:</b> hos, nær.<br><b>Eksempel:</b> Han er <b>hos</b> vennen sin.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> توضیح: حرف اضافه‌ای که به معنی بودن در همان مکان، نزدیک یا پیش کسی است.<br><b>مترادف:</b> نزدیک، پیش.<br><b>مثال:</b> او <b>پیش</b> دوستش است.</div>",
            "pt": "<b>Portúgalska (Português):</b> Explicação: Preposição que significa estar no mesmo lugar, perto ou visitando alguém.<br><b>Sinônimo:</b> perto de, com.<br><b>Exemplo:</b> Ele está <b>com</b> o amigo dele.",
            "pl": "<b>Pólska (Polski):</b> Wyjaśnienie: Przyimek oznaczający przebywanie w tym samym miejscu, w pobliżu lub w odwiedzinach u kogoś.<br><b>Synonim:</b> u, przy.<br><b>Przykład:</b> On jest <b>u</b> swojego przyjaciela.",
            "ro": "<b>Rúmenska (Română):</b> Explicație: Prepoziție care înseamnă a fi în același loc, aproape sau în vizită la cineva.<br><b>Sinonim:</b> la, lângă.<br><b>Exemplu:</b> El este <b>la</b> prietenul său.",
            "ru": "<b>Rússneska (Русский):</b> Объяснение: Предлог, означающий нахождение в том же месте, рядом или в гостях.<br><b>Синоним:</b> у, около.<br><b>Пример:</b> Он находится <b>у</b> своего друга.",
            "es": "<b>Spænska (Español):</b> Explicación: Preposición que significa estar en el mismo lugar, cerca o visitando a alguien.<br><b>Sinónimo:</b> con, en casa de.<br><b>Ejemplo:</b> Él está <b>con / en casa de</b> su amigo.",
            "sv": "<b>Sænska (Svenska):</b> Förklaring: Preposition som betyder att vara på samma plats, nära, eller på besök hos någon.<br><b>Synonym:</b> hos, bredvid.<br><b>Exempel:</b> Han är <b>hos</b> sin vän.",
            "th": "<b>Tælenska (ภาษาไทย):</b> คำอธิบาย: บุพบทที่หมายถึงอยู่ในที่เดียวกัน ใกล้ๆ หรือไปเยี่ยมใครบางคน<br><b>คำพ้องความหมาย:</b> ใกล้, กับ<br><b>ตัวอย่าง:</b> เขาอยู่<b>กับ</b>เพื่อนของเขา",
            "uk": "<b>Úkraínska (Українська):</b> Пояснення: Прийменник, що означає перебування в тому ж місці, поруч або в гостях.<br><b>Синонім:</b> у, біля.<br><b>Приклад:</b> Він <b>у</b> свого друга.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Giới từ có nghĩa là ở cùng một nơi, gần, hoặc đến thăm ai đó.<br><b>Từ đồng nghĩa:</b> ở chỗ, cùng với.<br><b>Ví dụ:</b> Anh ấy đang <b>ở chỗ</b> bạn của anh ấy."
        }
    },
    { 
        text: "þið", 
        is_exp: "<b>Útskýring:</b> Persónufornafn í 2. persónu fleirtölu. Notað þegar talað er beint við tvo eða fleiri.<br><b>Samheiti:</b> þér (gamalt).<br><b>Dæmi:</b> Eruð <b>þið</b> heima núna?",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b> الشرح: ضمير شخصي لجمع المخاطب (أنتم). يُستخدم عند التحدث مباشرة مع شخصين أو أكثر.<br><b>مرادف:</b> أنتم.<br><b>مثال:</b> هل <b>أنتم</b> في المنزل الآن؟</div>",
            "da": "<b>Danska (Dansk):</b> Forklaring: Personligt stedord i 2. person flertal (I/jer). Bruges når man taler direkte til to eller flere.<br><b>Synonym:</b> I.<br><b>Eksempel:</b> Er <b>I</b> hjemme nu?",
            "en": "<b>Enska (English):</b> Explanation: Personal pronoun in the 2nd person plural. Used when talking directly to two or more people (you all).<br><b>Synonym:</b> you (plural).<br><b>Example:</b> Are <b>you (all)</b> home now?",
            "tl": "<b>Filippseyska (Tagalog):</b> Paliwanag: Panghalip panao sa pangalawang panauhan ng maramihan. Ginagamit kapag kinakausap nang direkta ang dalawa o higit pa.<br><b>Kasingkahulugan:</b> kayo.<br><b>Halimbawa:</b> Nasa bahay ba <b>kayo</b> ngayon?",
            "fr": "<b>Franska (Français):</b> Explication: Pronom personnel à la 2ème personne du pluriel (vous). Utilisé pour parler directement à deux personnes ou plus.<br><b>Synonyme:</b> vous.<br><b>Exemple:</b> Êtes-<b>vous</b> à la maison maintenant ?",
            "lv": "<b>Lettneska (Latviešu):</b> Paskaidrojums: Personas vietniekvārds daudzskaitļa 2. personā. Lieto, uzrunājot divus vai vairākus cilvēkus.<br><b>Sinonīms:</b> jūs.<br><b>Piemērs:</b> Vai <b>jūs</b> esat mājās tagad?",
            "lt": "<b>Litháíska (Lietuvių):</b> Paaiškinimas: Asmeninis įvardis antrajame asmenyje daugiskaita. Naudojamas kalbant tiesiogiai su dviem ar daugiau žmonių.<br><b>Sinonimas:</b> jūs.<br><b>Pavyzdys:</b> Ar <b>jūs</b> dabar namuose?",
            "no": "<b>Norska (Norsk):</b> Forklaring: Personlig pronomen i 2. person flertall (dere). Brukes når man snakker direkte til to eller flere.<br><b>Synonym:</b> dere.<br><b>Eksempel:</b> Er <b>dere</b> hjemme nå?",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> توضیح: ضمیر شخصی دوم شخص جمع. وقتی مستقیماً با دو یا چند نفر صحبت می‌کنید استفاده می‌شود.<br><b>مترادف:</b> شما.<br><b>مثال:</b> آیا <b>شما</b> الان خانه هستید؟</div>",
            "pt": "<b>Portúgalska (Português):</b> Explicação: Pronome pessoal na 2ª pessoa do plural. Usado ao falar diretamente com duas ou mais pessoas (vocês).<br><b>Sinônimo:</b> vocês.<br><b>Exemplo:</b> <b>Vocês</b> estão em casa agora?",
            "pl": "<b>Pólska (Polski):</b> Wyjaśnienie: Zaimek osobowy w 2. osobie liczby mnogiej. Używany podczas mówienia bezpośrednio do dwóch lub więcej osób.<br><b>Synonim:</b> wy.<br><b>Przykład:</b> Czy <b>wy</b> jesteście teraz w domu?",
            "ro": "<b>Rúmenska (Română):</b> Explicație: Pronume personal la persoana a 2-a plural. Folosit atunci când se vorbește direct cu două sau mai multe persoane.<br><b>Sinonim:</b> voi.<br><b>Exemplu:</b> Sunteți (<b>voi</b>) acasă acum?",
            "ru": "<b>Rússneska (Русский):</b> Объяснение: Личное местоимение во 2-м лице множественного числа. Используется при обращении к двум и более людям.<br><b>Синоним:</b> вы.<br><b>Пример:</b> <b>Вы</b> сейчас дома?",
            "es": "<b>Spænska (Español):</b> Explicación: Pronombre personal en segunda persona del plural. Se usa al hablar directamente con dos o más personas.<br><b>Sinónimo:</b> ustedes, vosotros.<br><b>Ejemplo:</b> ¿Están <b>ustedes</b> en casa ahora?",
            "sv": "<b>Sænska (Svenska):</b> Förklaring: Personligt pronomen i 2:a person plural (ni). Används när man talar direkt till två eller flera.<br><b>Synonym:</b> ni.<br><b>Exempel:</b> Är <b>ni</b> hemma nu?",
            "th": "<b>Tælenska (ภาษาไทย):</b> คำอธิบาย: สรรพนามบุรุษที่ 2 พหูพจน์ ใช้เมื่อพูดคุยโดยตรงกับสองคนขึ้นไป (พวกคุณ)<br><b>คำพ้องความหมาย:</b> พวกคุณ<br><b>ตัวอย่าง:</b> ตอนนี้<b>พวกคุณ</b>อยู่บ้านไหม?",
            "uk": "<b>Úkraínska (Українська):</b> Пояснення: Особовий займенник у 2-й особі множини. Використовується при звертанні до двох або більше людей.<br><b>Синонім:</b> ви.<br><b>Приклад:</b> <b>Ви</b> зараз вдома?",
            "vi": "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Đại từ nhân xưng ngôi thứ 2 số nhiều. Dùng khi nói chuyện trực tiếp với hai hoặc nhiều người.<br><b>Từ đồng nghĩa:</b> các bạn.<br><b>Ví dụ:</b> Bây giờ <b>các bạn</b> có ở nhà không?"
        }
    },
    { 
        text: "síðan", 
        is_exp: "<b>Útskýring:</b> Atviksorð um tíma. Getur þýtt „eftir það“ eða verið notað um tíma sem er liðinn. Hér þýðir það eftir það.<br><b>Samheiti:</b> þvínæst, á eftir. <b>Andheiti:</b> áður.<br><b>Dæmi:</b> Við borðum og förum <b>síðan</b> út.",
        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><b>Arabíska (العربية):</b> الشرح: ظرف زمان يعني 'بعد ذلك'.<br><b>مرادف:</b> ثم. <b>مضاد:</b> قبل.<br><b>مثال:</b> نحن نأكل <b>ثم</b> نخرج.</div>",
            "da": "<b>Danska (Dansk):</b> Forklaring: Tidsbiord, der betyder 'derefter' eller 'siden'. Her betyder det derefter.<br><b>Synonym:</b> derefter, så. <b>Antonym:</b> før.<br><b>Eksempel:</b> Vi spiser og går <b>derefter</b> ud.",
            "en": "<b>Enska (English):</b> Explanation: Adverb of time meaning 'after that', 'then', or 'since'. Here it means 'after that'.<br><b>Synonym:</b> then, afterwards. <b>Antonym:</b> before.<br><b>Example:</b> We eat and <b>then</b> go outside.",
            "tl": "<b>Filippseyska (Tagalog):</b> Paliwanag: Pang-abay na tumutukoy sa oras, nangangahulugang 'pagkatapos'.<br><b>Kasingkahulugan:</b> pagkatapos. <b>Kasalungat:</b> bago.<br><b>Halimbawa:</b> Kakain tayo at <b>pagkatapos</b> ay lalabas.",
            "fr": "<b>Franska (Français):</b> Explication: Adverbe de temps signifiant 'ensuite', 'puis' ou 'depuis'. Ici, il signifie 'ensuite'.<br><b>Synonyme:</b> ensuite, puis. <b>Antonyme:</b> avant.<br><b>Exemple:</b> Nous mangeons et <b>ensuite</b> nous sortons.",
            "lv": "<b>Lettneska (Latviešu):</b> Paskaidrojums: Laika apstākļa vārds, kas nozīmē 'pēc tam' vai 'kopš'. Šeit tas nozīmē 'pēc tam'.<br><b>Sinonīms:</b> pēc tam, tad. <b>Antonīms:</b> pirms.<br><b>Piemērs:</b> Mēs paēdam un <b>tad</b> ejam ārā.",
            "lt": "<b>Litháíska (Lietuvių):</b> Paaiškinimas: Laiko prievezmis, reiškiantis 'po to' arba 'nuo to laiko'. Čia reiškia 'po to'.<br><b>Sinonimas:</b> po to, tuomet. <b>Antonimas:</b> prieš.<br><b>Pavyzdys:</b> Mes pavalgome ir <b>po to</b> einame į lauką.",
            "no": "<b>Norska (Norsk):</b> Forklaring: Tidsadverb som betyr 'etter det' eller 'siden'. Her betyr det etter det.<br><b>Synonym:</b> deretter, så. <b>Antonym:</b> før.<br><b>Eksempel:</b> Vi spiser og går <b>deretter</b> ut.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> توضیح: قید زمان به معنی «سپس» یا «پس از آن».<br><b>مترادف:</b> سپس، بعد. <b>متضاد:</b> قبل.<br><b>مثال:</b> ما غذا می‌خوریم و <b>سپس</b> بیرون می‌رویم.</div>",
            "pt": "<b>Portúgalska (Português):</b> Explicação: Advérbio de tempo que significa 'depois disso', 'então' ou 'desde'. Aqui significa 'depois disso'.<br><b>Sinônimo:</b> depois, então. <b>Antônimo:</b> antes.<br><b>Exemplo:</b> Nós comemos e <b>depois</b> saímos.",

            "da": "<b>Danska (Dansk):</b> Forklaring: Udsagnsordet 'at have' i konjunktiv. Bruges ofte til at udtrykke et ønske eller tvivl.<br><b>Synonym:</b> ejer.<br><b>Eksempel:</b> Jeg håber, at han <b>har</b> tid.",
            "en": "<b>Enska (English):</b> Explanation: The verb 'to have' in the subjunctive mood. Often used to express a wish or doubt.<br><b>Synonym:</b> possess, own.<br><b>Example:</b> I hope that he <b>has</b> time.",
            "tl": "<b>Filippseyska (Tagalog):</b> Paliwanag: Ang pandiwang 'magkaroon' sa subjunctive mood. Kadalasang ginagamit para magpahayag ng hiling o pagdududa.<br><b>Kasingkahulugan:</b> nagmamay-ari.<br><b>Halimbawa:</b> Sana ay <b>magkaroon</b> siya ng oras.",
            "fr": "<b>Franska (Français):</b> Explication: Le verbe 'avoir' au subjonctif. Souvent utilisé pour exprimer un souhait ou un doute.<br><b>Synonyme:</b> possède.<br><b>Exemple:</b> J'espère qu'il <b>ait (a)</b> le temps.",
            "lv": "<b>Lettneska (Latviešu):</b> Paskaidrojums: Darbības vārds 'būt' (piederēt) vēlējuma izteiksmē. Bieži lieto, lai izteiktu vēlmi vai šaubas.<br><b>Sinonīms:</b> pieder.<br><b>Piemērs:</b> Es ceru, ka viņam <b>ir</b> laiks.",
            "lt": "<b>Litháíska (Lietuvių):</b> Paaiškinimas: Veiksmažodis 'turėti' tariamojoje nuosakoje. Dažnai naudojamas išreikšti norą ar abejonę.<br><b>Sinonimas:</b> turi.<br><b>Pavyzdys:</b> Tikiuosi, kad jis <b>turi</b> laiko.",
            "no": "<b>Norska (Norsk):</b> Forklaring: Verbet 'å ha' i konjunktiv. Brukes ofte for å uttrykke et ønske eller tvil.<br><b>Synonym:</b> eier.<br><b>Eksempel:</b> Jeg håper at han <b>har</b> tid.",
            "fa": "<div dir='rtl' style='text-align: right;'><b>Persneska (فارسی):</b> توضیح: فعل «داشتن» در وجه التزامی. اغلب برای بیان آرزو یا شک استفاده می‌شود.<br><b>مترادف:</b> دارا باشد.<br><b>مثال:</b> امیدوارم او وقت <b>داشته باشد</b>.</div>",
            "pt": "<b>Portúgalska (Português):</b> Explicação: O verbo 'ter' no modo subjuntivo. Frequentemente usado para expressar um desejo ou dúvida.<br><b>Sinônimo:</b> possua.<br><b>Exemplo:</b> Espero que ele <b>tenha</b> tempo.",
            "pl": "<b>Pólska (Polski):</b> Wyjaśnienie: Czasownik 'mieć' w trybie łączącym. Często używany do wyrażenia życzenia lub wątpliwości.<br><b>Synonim:</b> posiada.<br><b>Przykład:</b> Mam nadzieję, że on <b>ma</b> czas.",
            "ro": "<b>Rúmenska (Română):</b> Explicație: Verbul 'a avea' la conjunctiv. Adesea folosit pentru a exprima o dorință sau îndoială.<br><b>Sinonim:</b> să posede.<br><b>Exemplu:</b> Sper că <b>are</b> timp.",
            "ru": "<b>Rússneska (Русский):</b> Объяснение: Глагол 'иметь' в сослагательном наклонении. Часто используется для выражения желания или сомнения.<br><b>Синоним:</b> располагает.<br><b>Пример:</b> Я надеюсь, что у него <b>есть</b> (будет) время.",
            "es": "<b>Spænska (Español):</b> Explicación: El verbo 'tener' en modo subjuntivo. Usado a menudo para expresar un deseo o duda.<br><b>Sinónimo:</b> posea.<br><b>Ejemplo:</b> Espero que él <b>tenga</b> tiempo.",
            "sv": "<b>Sænska (Svenska):</b> Förklaring: Verbet 'att ha' i konjunktiv. Används ofta för att uttrycka en önskan eller ett tvivel.<br><b>Synonym:</b> äger.<br><b>Exempel:</b> Jag hoppas att han <b>har</b> tid.",
            "th": "<b>Tælenska (ภาษาไทย):</b> คำอธิบาย: กริยา 'มี' ในรูปประโยคสมมติ มักใช้เพื่อแสดงความปรารถนาหรือความสงสัย<br><b>คำพ้องความหมาย:</b> ครอบครอง<br><b>ตัวอย่าง:</b> ฉันหวังว่าเขาจะ<b>มี</b>เวลา",
            "uk": "<b>Úkraínska (Українська):</b> Пояснення: Дієслово 'мати' в умовному способі. Часто використовується для вираження бажання або сумніву.<br><b>Синонім:</b> володіє.<br><b>Приклад:</b> Сподіваюся, він <b>має</b> (матиме) час.",
            "vi": "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Động từ 'có' ở thể giả định. Thường được sử dụng để thể hiện một mong muốn hoặc sự nghi ngờ.<br><b>Từ đồng nghĩa:</b> sở hữu.<br><b>Ví dụ:</b> Tôi hy vọng anh ấy <b>có</b> thời gian."
        }
    }
];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `
        <h1>Markorð: 81 - 90 algengustu orðin.</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="lang-selector">
            <label for="languageSelect"><b>🌍 Veldu tungumál:</b></label>
            <select id="languageSelect" onchange="updateUI()">
                <option value="ar">Arabíska – العربية</option>
                <option value="da">Danska – Dansk</option>
                <option value="en" selected>Enska – English</option>
                <option value="tl">Filippseyska – Tagalog / Filipino</option>
                <option value="fr">Franska – Français</option>
                <option value="lv">Lettneska – Latviešu</option>
                <option value="lt">Litháíska – Lietuvių</option>
                <option value="no">Norska – Norsk</option>
                <option value="fa">Persneska – فارسی</option>
                <option value="pt">Portúgalska – Português</option>
                <option value="pl">Pólska – Polski</option>
                <option value="ro">Rúmenska – Română</option>
                <option value="ru">Rússneska – Русский</option>
                <option value="es">Spænska – Español</option>
                <option value="sv">Sænska – Svenska</option>
                <option value="th">Tælenska – ภาษาไทย</option>
                <option value="uk">Úkraínska – Українська</option>
                <option value="vi">Víetnamska – Tiếng Việt</option>
            </select>
        </div>

        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
        <div class="feedback-note">
            Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'en';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð: 81 - 90 algengustu orðin.', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</body>
</html>
