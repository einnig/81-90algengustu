<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Æfing 81 - 90 algengustu orðin í íslenskum námsbókum</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.3em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.05em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.8; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 60%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Æfing 81 - 90 algengustu orðin í íslenskum námsbókum</h1>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div id="counter"></div>
    
    <div id="target"></div>
    <div id="is-explanation"></div>
    <br>
    <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
    
    <div id="spoken"></div>
    <div id="result"></div>

    <div id="media-box"></div>

    <div class="nav-btns">
        <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
        <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
    </div>
</div>

<script>
const exerciseData = [
    { 
        text: "hjá", 
        is_exp: "<b>Útskýring:</b> Forsetning sem þýðir að vera á sama stað, nærri, eða í heimsókn hjá einhverjum.<br><b>Dæmi:</b> Hann er <b>hjá</b> vini sínum.",
        translations: "<b>Enska (English):</b> Explanation: Preposition meaning to be at the same place, near, or visiting someone (with / at). Example: He is <b>with / at</b> his friend's.<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Przyimek oznaczający przebywanie w tym samym miejscu lub w pobliżu kogoś (u / z). Przykład: On jest <b>u</b> swojego przyjaciela.<br>" +
                      "<b>Spænska (Español):</b> Explicación: Preposición que significa estar en el mismo lugar o visitar a alguien (con / en casa de). Ejemplo: Él está <b>con / en casa de</b> su amigo.<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Giới từ có nghĩa là ở cùng một nơi, ở gần, hoặc đến thăm ai đó. Ví dụ: Anh ấy đang <b>ở chỗ</b> bạn của anh ấy.<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: حرف جر يعني التواجد في نفس المكان، بالقرب، أو عند زيارة شخص ما. مثال: هو <b>عند</b> صديقه.<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Предлог, означающий нахождение в том же месте, рядом или в гостях у кого-то (у / с). Пример: Он находится <b>у</b> своего друга.<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Прийменник, що означає перебування в тому ж місці, поруч або в гостях у когось (у / з). Приклад: Він знаходиться <b>у</b> свого друга.<br>" +
                      "<b>Persneska (فارسی):</b> توضیح: حرف اضافه به معنی بودن در همان مکان، نزدیک یا پیش کسی. مثال: او <b>پیش</b> دوستش است.<br>" +
                      "<b>Tælenska (ไทย):</b> คำอธิบาย: คำบุพบทหมายถึงการอยู่ที่เดียวกัน ใกล้เคียง หรือไปเยี่ยมใครบางคน ตัวอย่าง: เขาอยู่<b>กับ</b>เพื่อนของเขา<br>" +
                      "<b>Portúgalska (Português):</b> Explicativo: Preposição que significa estar no mesmo lugar, perto, ou visitando alguém (com / na casa de). Exemplo: Ele está <b>com</b> o amigo dele.<br>" +
                      "<b>Kínverska (中文):</b> 解释：介词，表示在同一个地方、在附近，或在某人那里。 例句：他在他朋友<b>那里</b>。<br>" +
                      "<b>Lettneska (Latviešu):</b> Paskaidrojums: Prievārds, kas nozīmē atrasties tajā pašā vietā, tuvu vai ciemos pie kāda. Piemērs: Viņš ir <b>pie</b> sava drauga."
    },
    { 
        text: "þið", 
        is_exp: "<b>Útskýring:</b> Persónufornafn í annarri persónu fleirtölu. Notað þegar talað er beint við tvo eða fleiri.<br><b>Dæmi:</b> Eruð <b>þið</b> heima núna?",
        translations: "<b>Enska (English):</b> Explanation: Personal pronoun in the 2nd person plural. Used when talking directly to two or more people (you all). Example: Are <b>you (all)</b> home now?<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Zaimek osobowy w 2. osobie liczby mnogiej. Używany, gdy mówimy do dwóch lub więcej osób (wy). Przykład: Czy <b>wy</b> jesteście teraz w domu?<br>" +
                      "<b>Spænska (Español):</b> Explicación: Pronombre personal en segunda persona del plural. Se usa al hablar directamente con dos o más personas (vosotros / ustedes). Ejemplo: ¿Están <b>ustedes</b> en casa ahora?<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Đại từ nhân xưng ngôi thứ 2 số nhiều. Dùng khi nói trực tiếp với hai hoặc nhiều người (các bạn). Ví dụ: Bây giờ <b>các bạn</b> có ở nhà không?<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: ضمير شخصي للمخاطب الجمع. يُستخدم عند التحدث مباشرة مع شخصين أو أكثر (أنتم). مثال: هل <b>أنتم</b> في المنزل الآن؟<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Личное местоимение во 2-м лице множественного числа. Используется при обращении к двум и более людям (вы). Пример: <b>Вы</b> сейчас дома?<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Особовий займенник у 2-й особі множини. Використовується при звертанні до двох і більше людей (ви). Приклад: <b>Ви</b> зараз вдома?<br>" +
                      "<b>Persneska (فارسی):</b> توضیح: ضمیر شخصی برای دوم شخص جمع. برای صحبت مستقیم با دو یا چند نفر استفاده می‌شود (شما). مثال: آیا <b>شما</b> الان خانه هستید؟<br>" +
                      "<b>Tælenska (ไทย):</b> คำอธิบาย: สรรพนามบุรุษที่ 2 พหูพจน์ ใช้เมื่อพูดคุยโดยตรงกับสองคนขึ้นไป (พวกคุณ) ตัวอย่าง: ตอนนี้<b>พวกคุณ</b>อยู่บ้านไหม?<br>" +
                      "<b>Portúgalska (Português):</b> Explicativo: Pronome pessoal na 2ª pessoa do plural. Usado ao falar com duas ou mais pessoas (vocês). Exemplo: <b>Vocês</b> estão em casa agora?<br>" +
                      "<b>Kínverska (中文):</b> 解释：第二人称复数代词。用于直接对两个或更多的人说话（你们）。 例句：<b>你们</b>现在在家吗？<br>" +
                      "<b>Lettneska (Latviešu):</b> Paskaidrojums: Personas vietniekvārds daudzskaitļa 2. personā. Lieto, runājot tieši ar diviem vai vairākiem cilvēkiem (jūs). Piemērs: Vai <b>jūs</b> tagad esat mājās?"
    },
    { 
        text: "síðan", 
        is_exp: "<b>Útskýring:</b> Atviksorð sem táknar tíma og þýðir „eftir það“ eða „þá“. Getur líka verið notað um tíma sem er liðinn.<br><b>Dæmi:</b> Við borðum og förum <b>síðan</b> út.",
        translations: "<b>Enska (English):</b> Explanation: Adverb of time meaning 'after that', 'then', or 'since'. Example: We eat and <b>then</b> go outside.<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Przysłówek czasu oznaczający 'potem', 'następnie' lub 'od tego czasu'. Przykład: Jemy, a <b>potem</b> wychodzimy.<br>" +
                      "<b>Spænska (Español):</b> Explicación: Adverbio de tiempo que significa 'después de eso', 'luego' o 'desde entonces'. Ejemplo: Comemos y <b>luego</b> salimos.<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Trạng từ chỉ thời gian có nghĩa là 'sau đó' hoặc 'kể từ đó'. Ví dụ: Chúng tôi ăn và <b>sau đó</b> đi ra ngoài.<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: ظرف زمان يعني 'بعد ذلك' أو 'ثم' أو 'منذ'. مثال: نحن نأكل <b>ثم</b> نخرج.<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Наречие времени, означающее 'после этого', 'затем' или 'с тех пор'. Пример: Мы едим, а <b>затем</b> идем на улицу.<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Прислівник часу, що означає 'після цього', 'потім' або 'відтоді'. Приклад: Ми їмо, а <b>потім</b> йдемо надвір.<br>" +
                      "<b>Persneska (فارسی):</b> توضیح: قید زمان به معنی «پس از آن»، «سپس» یا «از آن زمان». مثال: ما غذا می‌خوریم و <b>سپس</b> بیرون می‌رویم.<br>" +
                      "<b>Tælenska (ไทย):</b> คำอธิบาย: กริยาวิเศษณ์บอกเวลา หมายถึง 'หลังจากนั้น' 'จากนั้น' หรือ 'ตั้งแต่' ตัวอย่าง: พวกเรากินข้าวและ<b>จากนั้น</b>ก็ออกไปข้างนอก<br>" +
                      "<b>Portúgalska (Português):</b> Explicativo: Advérbio de tempo que significa 'depois disso', 'então' ou 'desde'. Exemplo: Nós comemos e <b>depois</b> saímos.<br>" +
                      "<b>Kínverska (中文):</b> 解释：表示时间的副词，意思是“在那之后”、“然后”或“自从”。 例句：我们先吃饭，<b>然后</b>出去。<br>" +
                      "<b>Lettneska (Latviešu):</b> Paskaidrojums: Laika apstākļa vārds, kas nozīmē 'pēc tam', 'tad' vai 'kopš'. Piemērs: Mēs paēdam un <b>tad</b> ejam ārā."
    },
    { 
        text: "sagði", 
        is_exp: "<b>Útskýring:</b> Sagnorðið „að segja“ í þátíð. Þýðir að ég, hann eða hún talaði eða lét orð falla.<br><b>Dæmi:</b> Hún <b>sagði</b> mér frá bókinni.",
        translations: "<b>Enska (English):</b> Explanation: The verb 'to say' or 'to tell' in the past tense (I, he, or she spoke). Example: She <b>told</b> me about the book.<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Czasownik 'powiedzieć' lub 'opowiedzieć' w czasie przeszłym. Przykład: Ona <b>opowiedziała</b> mi o książce.<br>" +
                      "<b>Spænska (Español):</b> Explicación: El verbo 'decir' o 'contar' en tiempo pasado. Ejemplo: Ella me <b>contó</b> sobre el libro.<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Động từ 'nói' hoặc 'kể' ở thì quá khứ. Ví dụ: Cô ấy đã <b>kể</b> cho tôi nghe về cuốn sách.<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: الفعل 'قال' أو 'أخبر' في الزمن الماضي. مثال: لقد <b>أخبرتني</b> عن الكتاب.<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Глагол 'сказать' или 'рассказать' в прошедшем времени. Пример: Она <b>рассказала</b> мне о книге.<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Дієслово 'сказати' або 'розповісти' в минулому часі. Приклад: Вона <b>розповіла</b> мені про книгу.<br>" +
                      "<b>Persneska (فارسی):</b> توضیح: فعل «گفتن» یا «تعریف کردن» در زمان گذشته. مثال: او درباره کتاب به من <b>گفت</b>.<br>" +
                      "<b>Tælenska (ไทย):</b> คำอธิบาย: กริยา 'พูด' หรือ 'บอก' ในอดีตกาล ตัวอย่าง: เธอ<b>เล่า</b>ให้ฉันฟังเกี่ยวกับหนังสือ<br>" +
                      "<b>Portúgalska (Português):</b> Explicativo: O verbo 'dizer' ou 'contar' no tempo passado. Exemplo: Ela me <b>contou</b> sobre o livro.<br>" +
                      "<b>Kínverska (中文):</b> 解释：动词“说”或“告诉”的过去时形式。 例句：她<b>告诉</b>了我关于那本书的事。<br>" +
                      "<b>Lettneska (Latviešu):</b> Paskaidrojums: Darbības vārds 'teikt' vai 'stāstīt' pagātnē. Piemērs: Viņa man <b>pastāstīja</b> par grāmatu."
    },
    { 
        text: "varð", 
        is_exp: "<b>Útskýring:</b> Sagnorðið „að verða“ í þátíð (1. eða 3. persónu). Þýðir að eitthvað breyttist yfir í annað ástand.<br><b>Dæmi:</b> Veðrið <b>varð</b> mjög vont í gær.",
        translations: "<b>Enska (English):</b> Explanation: The verb 'to become' in the past tense. Means something changed into another state. Example: The weather <b>became</b> very bad yesterday.<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Czasownik 'stać się / zostać' w czasie przeszłym. Oznacza zmianę w inny stan. Przykład: Pogoda <b>stała się</b> wczoraj bardzo zła.<br>" +
                      "<b>Spænska (Español):</b> Explicación: El verbo 'convertirse' o 'ponerse' en tiempo pasado. Significa que algo cambió de estado. Ejemplo: El clima se <b>puso</b> muy malo ayer.<br>" +
                      "<b>Víetnamska (Tiếng Việt):</b> Giải thích: Động từ 'trở nên' ở thì quá khứ. Nghĩa là một thứ gì đó đã chuyển sang trạng thái khác. Ví dụ: Thời tiết hôm qua đã <b>trở nên</b> rất xấu.<br>" +
                      "<b>Arabíska (العربية):</b> الشرح: الفعل 'أصبح' في الزمن الماضي. يعني أن شيئاً تغير إلى حالة أخرى. مثال: <b>أصبح</b> الطقس سيئاً جداً البارحة.<br>" +
                      "<b>Rússneska (Русский):</b> Объяснение: Глагол 'стать' в прошедшем времени. Означает, что что-то перешло в другое состояние. Пример: Погода вчера <b>стала</b> очень плохой.<br>" +
                      "<b>Úkraínska (Українська):</b> Пояснення: Дієслово 'стати' в минулому часі. Означає, що щось перейшло в інший стан. Приклад: Погода вчора <b>стала</b> дуже поганою.<br>" +
                      "<b>Persneska (فارسی):</b> توضیح: فعل «شدن» در زمان گذشته. به معنی تغییر چیزی به حالت دیگر. مثال: دیروز هوا خیلی بد <b>شد</b>.<br>" +
                      "<b>Tælenska (ไทย):</b> คำอธิบาย: กริยา 'กลายเป็น' ในอดีตกาล หมายถึงบางสิ่งเปลี่ยนเป็นอีกสถานะหนึ่ง ตัวอย่าง: เมื่อวานอากาศ<b>กลายเป็น</b>แย่มาก<br>" +
                      "<b>Portúgalska (Português):</b> Explicativo: O verbo 'tornar-se' ou 'ficar' no tempo passado. Significa que algo mudou de estado. Exemplo: O tempo <b>ficou</b> muito ruim ontem.<br>" +
                      "<b>Kínverska (中文):</b> 解释：动词“变成”的过去时形式。表示某物改变了状态。 例句：昨天的天气<b>变得</b>很糟糕。<br>" +
                      "<b>Lettneska (Latviešu):</b> Paskaidrojums: Darbības vārds 'kļūt' pagātnē. Nozīmē, ka kaut kas mainījies citā stāvoklī. Piemērs: Laiks vakar <b>kļuva</b> ļoti slikts."
    },
    { 
        text: "koma", 
        is_exp: "<b>Útskýring:</b> Sagnorð í nafnhætti sem þýðir að færast nær staðnum þar sem viðkomandi er staddur (að mæta eða heimsækja).<br><b>Dæmi:</b> Ætlar þú að <b>koma</b> í skólann?",
        translations: "<b>Enska (English):</b> Explanation: Verb in the infinitive meaning to move closer, arrive, or visit (to come). Example: Are you going to <b>come</b> to school?<br>" +
                      "<b>Pólska (Polski):</b> Objaśnienie: Czasownik w bezokoliczniku oznaczający zbliżanie się, przybycie (przyjść). Przykład: Zamierzasz <b>przyjść</b> do szkoły?<br>" +

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    // Slökkt sjálfkrafa þegar talningu eða þögn er lokið
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        // Hreinsa stöðutexta ef ekkert orð fannst
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    document.getElementById('progress-bar').style.width = percent + '%';
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    document.getElementById('app').innerHTML = `
        <h1>Æfing 81 - 90 algengustu orðin í íslenskum námsbókum</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>

                <button id="cert-btn" class="btn" style="background-color: #1a73e8; font-size: 1.5em; padding: 15px 30px; margin-top: 10px;" onclick="downloadCert()">🏆 Sækja viðurkenningarskjal</button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja aftur</button>

                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    document.getElementById('media-box').innerHTML = curr.translations;

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); // 1 sekúndu bið
        }
    };
}

function downloadCert() {
    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Æfing 81 - 90 algengustu orðin í íslenskum námsbókum', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    // Slekkur á takkanum til að koma í veg fyrir mörg skjöl
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
}
</script>
